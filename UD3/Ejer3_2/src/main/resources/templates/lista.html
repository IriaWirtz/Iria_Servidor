<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mostrar Lista</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div>
        <table>
            <tr>
               <th>Listado de numeros aleatorios</th>
            </tr>
            <tr th:each="num: ${nums}">
                    <td th:classappend="${num >= 50} ? 'rojo' : 'verde' "th:text="${num}"></td>

            </tr>


        </table>



    </div>

</body>
</html>
