<!DOCTYPE html>

    <title>Detalles Libros</title>

</head>
<body>

    <h1 th:text="${biblioteca[id].titulo}"></h1>
</header>

<main>

            <th>ID</th>

        </tr>


    </table>


</main>

</body>
</html>
